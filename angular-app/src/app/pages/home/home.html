<main class="max-w-7xl mx-auto py-4 flex gap-6 px-4 lg:px-0">
  <ul class="rounded-sm w-fit flex flex-col gap-3" id="users">
    @for (user of users; track user.id) {
      <li class="bg-purple-200/20 hover:bg-purple-400 rounded-sm">
        <app-user
          [selected]="selectedUser()?.id === user.id"
          (select)="onSelectUser($event)"
          [user]="user"
        ></app-user>
      </li>
    }
  </ul>

  @if (selectedUser()) {
    <div class="text-amber-50 w-full">
      <app-tasks [userSelected]="selectedUser()" id="user."></app-tasks>
    </div>
  } @else {
    <div id="fallback" class="text-white">Select a user to see their tasks!</div>
  }
</main>
