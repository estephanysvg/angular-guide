<section class="bg-purple-200/20 rounded-md p-4 flex flex-col gap-4">
  <header class="flex items-center justify-between">
    <h2 class="text-purple-100">{{ userSelected?.name }}'s Tasks</h2>
    <menu>
      <button
        class="bg-purple-700 hover:bg-purple-400 cursor-pointer text-white text-sm font-bold py-1 px-2 rounded"
      >
        Add Task
      </button>
    </menu>
  </header>

  <ul class="flex flex-col gap-3">
    @for (task of selecterUserTasks; track task.id) {
      <li>
        <app-task [task]="task" (complete)="onComplete($event)"></app-task>
      </li>
    }
  </ul>
</section>
